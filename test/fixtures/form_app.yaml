openapi: 3.0.3
info:
  title: Bookmarks
  description: An app whose form bodies are components, named by operationId.
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /sessions:
    post:
      operationId: signIn
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignInBody'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /accounts:
    post:
      operationId: signUp
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignUpBody'
      responses:
        '204':
          description: Signed up
  /passwords/reset:
    post:
      operationId: resetPassword
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordBody'
      responses:
        '204':
          description: Reset requested
  /folders/{id}/bookmarks:
    post:
      operationId: createBookmark
      tags: [Bookmarks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookmarkBody'
      responses:
        '204':
          description: Created
  /previews:
    post:
      operationId: getPreview
      tags: [Links]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PreviewBody'
      responses:
        '200':
          description: The preview of the link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preview'
components:
  schemas:
    SignInBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    SignUpBody:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
    ResetPasswordBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
    BookmarkBody:
      type: object
      required: [url]
      properties:
        url:
          type: string
    PreviewBody:
      type: object
      required: [url]
      properties:
        url:
          type: string
    Session:
      type: object
      required: [token]
      properties:
        token:
          type: string
    Preview:
      type: object
      properties:
        title:
          type: string
        image:
          type: string
