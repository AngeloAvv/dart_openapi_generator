name: Pipeline

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  analyze:
    name: Analyze ${{ matrix.working-directory }}
    strategy:
      matrix:
        working-directory:
          - example
          - .
    uses: ./.github/workflows/analyze.yml
    with:
      working-directory: ${{ matrix.working-directory }}

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    with:
      working-directory: .

  determinism:
    name: Determinism gate (build_runner)
    runs-on: ubuntu-latest
    needs:
      - analyze
      - test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart environment
        uses: ./.github/actions/dart
        with:
          working-directory: example

      - name: Run build_runner build on example
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: example

      - name: Check no uncommitted changes (determinism gate)
        run: git diff --exit-code

  format:
    name: Format idempotency gate
    runs-on: ubuntu-latest
    needs:
      - analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Get workspace dependencies
        run: dart pub get

      - name: Check dart format idempotency
        run: dart format --set-exit-if-changed .
