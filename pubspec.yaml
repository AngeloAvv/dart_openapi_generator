name: dart_openapi_generator
description: >-
  Native-Dart, OpenAPI 3.x → Dart code generator. Generates
  idiomatic Dio-based model classes and API client services via build_runner.
  No JVM. No Mustache. Generated code looks hand-written.
version: 0.3.0
repository: https://github.com/AngeloAvv/dart_openapi_generator
homepage: https://docs.page/angeloavv/dart_openapi_generator
issue_tracker: https://github.com/AngeloAvv/dart_openapi_generator/issues
topics:
  - openapi
  - code-generation
  - dart
  - build-runner

environment:
  sdk: "^3.7.0"

workspace:
  - example

dependencies:
  build: "^4.0.6"
  dart_style: "^3.0.0"
  meta: "^1.17.0"
  path: "^1.9.1"
  pub_semver: "^2.1.5"
  code_builder: "^4.11.1"
  source_span: "^1.10.0"
  yaml: "^3.1.3"

dev_dependencies:
  analyzer: ">=8.1.1 <14.0.0"
  build_test: "^3.5.12"
  lints: "^6.1.0"
  test: "^1.30.0"
